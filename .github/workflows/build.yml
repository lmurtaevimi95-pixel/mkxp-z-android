name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "ndk;23.1.7779620" "platforms;android-33" "build-tools;33.0.2"
      - name: Build native dependencies
        working-directory: app/jni
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/23.1.7779620
          NDK: /usr/local/lib/android/sdk/ndk/23.1.7779620
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config bison ruby cmake ninja-build
          bash get_deps.sh
          make
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
